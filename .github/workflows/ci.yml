name: CI Klab

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Usando macOS para conseguir compilar o iOS do Kotlin Multiplatform
    runs-on: macos-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache do Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Dar permissão de execução
      run: chmod +x gradlew

    - name: Compilar e Testar
      # TODO: Quando o projeto tiver mais testes e a regra de 80% do Kover for descomentada, 
      # adicione o comando 'koverVerify' aqui para o CI falhar caso a cobertura caia.
      # Exemplo futuro: ./gradlew build koverVerify
      run: ./gradlew build
